
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vercel_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - work_data:/app/work
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vercel_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vercel_worker
    command: python manage.py run_worker
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - work_data:/app/work
    restart: unless-stopped

volumes:
  redis_data:
  work_data:
